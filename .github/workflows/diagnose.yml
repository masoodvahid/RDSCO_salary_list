name: CI diagnostics (temporary)

# Temporary: mirrors ci.yml but reports each failing step's output as an annotation
# (readable through the API). Remove once CI is green.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tukahr_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tukahr_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, zip, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run each step and annotate failures
        shell: bash
        run: |
          set -u
          report() {
            # Strip ANSI, keep the failure section (or the tail), emit it as several annotations
            local name="$1" file="$2"
            sed -r 's/\x1B\[[0-9;]*[A-Za-z]//g' "$file" > "/tmp/${name}.clean"
            if grep -qnE '(FAILED|FAIL |Error|Exception)' "/tmp/${name}.clean" && [ "$name" = "tests" ]; then
              grep -vE '^\s*(✓|PASS)' "/tmp/${name}.clean" | grep -nE -A400 '(FAILED|⨯|FAIL )' | head -n 400 > "/tmp/${name}.section" || true
            fi
            [ -s "/tmp/${name}.section" ] || tail -n 120 "/tmp/${name}.clean" > "/tmp/${name}.section"
            split -C 2500 -d -a 1 "/tmp/${name}.section" "/tmp/${name}.part."
            for part in $(ls /tmp/${name}.part.* | head -n 9); do
              local body
              body=$(sed 's/%/%25/g' "$part" | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/\r/%0D/g')
              echo "::error title=${name} $(basename "$part")::${body}"
            done
          }
          step() {
            local name="$1"; shift
            echo "== ${name}"
            if ! "$@" > "/tmp/${name}.log" 2>&1; then
              cat "/tmp/${name}.log"
              report "$name" "/tmp/${name}.log"
              exit 1
            fi
            tail -n 5 "/tmp/${name}.log"
          }
          step composer composer install --no-interaction --prefer-dist
          step npm-install npm install
          step npm-build npm run build
          step env bash -c 'cp .env.example .env && php artisan key:generate'
          step migrate php artisan migrate --force
          step view-cache php artisan view:cache
          step tests php artisan test --colors=never
