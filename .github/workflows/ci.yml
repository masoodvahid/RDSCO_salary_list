name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tukahr_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_mysql, zip, gd
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: composer install --no-interaction --prefer-dist
      - run: npm install
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tukahr_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Compile Blade views
        run: php artisan view:cache
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tukahr_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          php artisan test --log-junit junit.xml 2>&1 | tee test-output.log
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tukahr_test
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Annotate failed tests
        if: failure()
        run: php .github/report-junit.php junit.xml test-output.log
